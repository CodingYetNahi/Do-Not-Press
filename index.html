<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>DON'T PRESS THAT — 100 Fast Fun Mini Games</title>
  <meta name="description" content="Play DON'T PRESS THAT, a free fast-paced fun game with 100 bite-size arcade mini games, reaction challenges, memory games, timing tests and quick puzzles.">
  <meta name="keywords" content="fun game, mini games, arcade game, browser game, free online game, reaction game, quick games, casual game, memory game, timing game, mobile game, HTML5 game">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <link rel="canonical" href="https://whyiamdoingthis.fun/">
  <link rel="manifest" href="./site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DON'T PRESS THAT">
  <meta property="og:title" content="DON'T PRESS THAT — 100 Fast Fun Mini Games">
  <meta property="og:description" content="A free rapid-fire arcade packed with 100 quick mini games.">
  <meta property="og:url" content="https://whyiamdoingthis.fun/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="DON'T PRESS THAT — 100 Fast Fun Mini Games">
  <meta name="twitter:description" content="100 quick arcade mini games in one free browser game.">
  <link rel="stylesheet" href="./styles/main.css">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"VideoGame","name":"DON'T PRESS THAT","url":"https://whyiamdoingthis.fun/","description":"A free browser arcade with 100 fast mini games focused on reaction, memory, timing and quick decisions.","genre":["Arcade","Casual","Puzzle","Reaction"],"playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Any modern web browser","inLanguage":"en","isAccessibleForFree":true}
  </script>
</head>
<body>
  <main id="app" aria-live="polite">
    <header class="hud hidden" id="hud" aria-label="Game score">
      <div><small>SCORE</small><strong id="score">0</strong></div>
      <div><small>BEST</small><strong id="best">0</strong></div>
    </header>

    <button id="mute" class="icon-button" aria-label="Mute sound" title="Sound">♪</button>

    <section id="intro" class="screen intro">
      <h1>DON'T<br><span>PRESS</span><br>THAT</h1>
      <button id="forbidden" class="forbidden" aria-label="Start DON'T PRESS THAT"><span>DO NOT<br>PRESS</span></button>
    </section>

    <section id="game" class="screen hidden" aria-label="Current mini game">
      <div id="instruction" class="instruction"></div>
      <div id="sub" class="sub"></div>
      <div id="timer" class="timer" aria-label="Time remaining"><i></i></div>
      <div id="arena" class="arena" role="application" aria-label="Challenge play area" tabindex="-1"></div>
    </section>

    <section id="gameover" class="screen gameover hidden">
      <p class="eyebrow">GAME OVER</p>
      <h2><span id="final-score">0</span></h2>
      <p class="best-line">BEST <b id="final-best">0</b></p>
      <p id="verdict" class="verdict"></p>
      <button id="restart" class="cta">PLAY AGAIN</button>
    </section>

    <div id="flash" aria-hidden="true"></div>
    <div id="toast" role="status"></div>
  </main>
  <noscript>JavaScript is required to play.</noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
